name: Backend CI

on:
  push:
    branches: [ main, v5-implementation ]
  pull_request:
    branches: [ main, v5-implementation ]

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aiol
          POSTGRES_PASSWORD: aiol_dev_password
          POSTGRES_DB: aiol
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://aiol:aiol_dev_password@localhost:5432/aiol

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check Persian letter order
        run: node visual-harness/check-persian.js

      - name: Check translation templates
        run: node visual-harness/i18n-coverage.js

      - name: Check source characters
        run: |
          node visual-harness/check-source-chars.js
          node visual-harness/check-source-chars.js visual-harness/e2e

      - name: Install browser for harness checks
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright-core@1.56.1
          node "$RUNNER_TEMP/pw/node_modules/playwright-core/cli.js" install --with-deps chromium

      - name: Harness browser checks
        env:
          PLAYWRIGHT_CORE: ${{ runner.temp }}/pw/node_modules/playwright-core
        run: node visual-harness/e2e/knowledge-quickfix.js

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd cloud-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run migrations
        run: |
          cd cloud-core
          alembic upgrade head

      - name: Run tests
        env:
          AIOL_SOURCE_STORE: ${{ runner.temp }}/aiol-sources
        run: |
          cd cloud-core
          pytest -q --durations=20 --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=92

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: cloud-core/coverage.xml
          retention-days: 7