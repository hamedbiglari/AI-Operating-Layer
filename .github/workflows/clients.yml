name: Client suite CI

# ADR-137. Builds and tests the official clients. Windows and macOS packages are produced on GitHub-hosted runners,
# which is the only place in this project's toolchain where those platforms exist. Artifacts are UNSIGNED unless
# the signing secrets named in clients/README.md are configured; nothing here publishes to a store.

on:
  push:
    paths: [ 'clients/**', 'frontend/**', '.github/workflows/clients.yml' ]
  pull_request:
    paths: [ 'clients/**', 'frontend/**', '.github/workflows/clients.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared:
    name: Shared UI — unit tests, design-system parity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Design system copies match frontend/
        run: node clients/scripts/sync-design-system.mjs --check
      - name: Unit tests
        run: cd clients && npm test

  e2e:
    name: Shared UI against a live Cloud Core (Chromium)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aiol
          POSTGRES_PASSWORD: aiol_dev_password
          POSTGRES_DB: aiol
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://aiol:aiol_dev_password@localhost:5432/aiol
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Cloud Core
        run: |
          cd cloud-core
          pip install -r requirements.txt
          alembic upgrade head
          APP_ENV=development AIOL_SOURCE_STORE=$RUNNER_TEMP/src CORS_ALLOWED_ORIGINS=http://127.0.0.1:5174 \
            CLIENT_HELP_URL=https://help.aiol.example/ CLIENT_PRIVACY_URL=https://aiol.example/privacy \
            nohup uvicorn app.main:app --host 127.0.0.1 --port 8010 > $RUNNER_TEMP/uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8010/api/v1/health/live && break; sleep 1; done
      - name: Browser
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright-core@1.56.1
          node "$RUNNER_TEMP/pw/node_modules/playwright-core/cli.js" install --with-deps chromium
      - name: End-to-end
        env:
          PLAYWRIGHT_CORE: ${{ runner.temp }}/pw/node_modules/playwright-core
        run: cd clients && node e2e/run.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screenshots
          path: clients/e2e/out/
          retention-days: 7

  shell-tests:
    name: Native shell — Rust tests (Linux host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - name: cargo test
        run: cd clients/src-tauri && cargo test --locked

  desktop:
    name: Package — ${{ matrix.name }}
    needs: [ shared, shell-tests ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            args: ''
          - name: macOS universal
            os: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Rust targets (macOS universal)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Production API endpoint
        shell: bash
        env:
          AIOL_API_BASE_URL: ${{ vars.AIOL_API_BASE_URL }}
        run: |
          if [ -n "$AIOL_API_BASE_URL" ]; then
            printf '{"apiBaseUrl": "%s", "environment": "production"}\n' "$AIOL_API_BASE_URL" > clients/app/app-config.json
          else
            echo "::warning::AIOL_API_BASE_URL is not set; this package points at a loopback development server"
          fi
      - name: Build
        shell: bash
        env:
          # Optional. Without them the packages are unsigned (and say so in the job summary).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd clients
          npm ci --no-audit --no-fund
          npx tauri build ${{ matrix.args }}
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then echo "UNSIGNED build" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7
        with:
          name: aiol-${{ runner.os }}
          path: |
            clients/src-tauri/target/release/bundle/
            clients/src-tauri/target/universal-apple-darwin/release/bundle/
          retention-days: 14

  android:
    name: Package — Android (unsigned debug APK)
    needs: [ shared, shell-tests ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu images ship the Android SDK at $ANDROID_HOME; android-actions/setup-android@v3 fails
      # on the Node 24 runtime, so the preinstalled sdkmanager is used directly.
      - name: NDK and Rust targets
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973"
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: Build
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          cd clients
          npm ci --no-audit --no-fund
          scripts/mobile-setup.sh android
          npx tauri android build --debug --apk
      - uses: actions/upload-artifact@v7
        with:
          name: aiol-android-debug
          path: clients/src-tauri/gen/android/app/build/outputs/
          retention-days: 14

  ios:
    name: Build — iOS simulator (no signing)
    needs: [ shared, shell-tests ]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build
        run: |
          rustup target add aarch64-apple-ios-sim
          cd clients
          npm ci --no-audit --no-fund
          scripts/mobile-setup.sh ios
          npx tauri ios build --target aarch64-sim --debug
