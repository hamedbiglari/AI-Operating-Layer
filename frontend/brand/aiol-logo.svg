<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" role="img" aria-labelledby="t d">
  <title id="t">AI Operating Layer</title><desc id="d">Scattered sources connected into one unified piece of knowledge.</desc>
  <defs><radialGradient id="h" cx=".36" cy=".32" r=".8"><stop offset="0" stop-color="#22d3ee"/><stop offset=".6" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f472b6"/></radialGradient>
  <style>.m{transform-origin:16px 16px;animation:br 5.2s ease-in-out infinite}.k{stroke-width:1.15;stroke-linecap:round;opacity:.9}
  .n{fill:none;stroke-width:.97;transform-box:fill-box;transform-origin:center;animation:nd 5.2s ease-in-out infinite}
  .n2{animation-delay:-1s}.n3{animation-delay:-2s}.n4{animation-delay:-3s}.n5{animation-delay:-4s}
  .h{transform-box:fill-box;transform-origin:center;animation:hb 5.2s ease-in-out infinite}
  @keyframes br{0%,100%{transform:scale(.95)}50%{transform:scale(1.05)}}@keyframes hb{0%,100%{transform:scale(.9)}50%{transform:scale(1.12)}}
  @keyframes nd{0%,100%{transform:scale(.86);opacity:.8}50%{transform:scale(1.14);opacity:1}}
  @media (prefers-reduced-motion:reduce){.m,.h,.n{animation:none}}</style></defs>
