# AIOL deployment stack. Copy .env.example to .env, fill in the required values, then:
#   docker compose up -d --build
# Services: postgres (pgvector), redis, migrate (one-shot `alembic upgrade head`), cloud-core (FastAPI),
# celery-worker, celery-beat, visual-harness (nginx serving the static harness).
# The cloud-core image starts in production mode and refuses to boot while SECRET_KEY or the database
# password still hold development defaults (security audit SEC-09); set APP_ENV=development in .env for
# local work. Postgres and Redis listen on 127.0.0.1 only: reachable from this machine (tests, a local
# backend), never from the network.

x-cloud-core: &cloud-core
  build:
    context: ./cloud-core
    dockerfile: Dockerfile
  image: aiol/cloud-core:local
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    # Inside the stack the services are reached by name, whatever .env says for local (non-Docker) runs.
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aiol}:${POSTGRES_PASSWORD:-aiol_dev_password}@postgres:5432/${POSTGRES_DB:-aiol}
    REDIS_URL: ${REDIS_URL_INTERNAL:-redis://redis:6379/0}
    # Resolved from the shell first, then .env, so a script can run the stack in development mode and give
    # the worker the same credential key as a backend started outside Docker (scripts/start-real-e2e.ps1).
    APP_ENV: ${APP_ENV:-production}
    AI_CREDENTIAL_KEY: ${AI_CREDENTIAL_KEY:-}
  volumes:
    # Uploaded source files: written by the API, read by the worker that converts them.
    - sources:/var/lib/aiol/sources

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aiol_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiol_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-aiol}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiol} -d ${POSTGRES_DB:-aiol}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aiol_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies every pending migration, then exits. The API and the workers start only after it succeeds.
  migrate:
    <<: *cloud-core
    container_name: aiol_migrate
    restart: "no"
    volumes: []
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  cloud-core:
    <<: *cloud-core
    container_name: aiol_api
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # All asynchronous work: document conversion, AI jobs, workspace runs, research.
  celery-worker:
    <<: *cloud-core
    container_name: aiol_worker
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Periodic jobs (stale AI-execution reclaim, AI-job recovery, device-observation purge).
  # Exactly one beat process per deployment, or jobs are scheduled twice.
  celery-beat:
    <<: *cloud-core
    container_name: aiol_beat
    volumes: []
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info",
              "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The visual harness is static HTML; nginx serves it read-only. Add its origin
  # (http://localhost:${HARNESS_PORT}) to CORS_ALLOWED_ORIGINS so it can call cloud-core.
  visual-harness:
    image: nginx:1.27-alpine
    container_name: aiol_harness
    restart: unless-stopped
    ports:
      - "${HARNESS_PORT:-8080}:80"
    volumes:
      - ./visual-harness:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  redisdata:
  sources:
